name: CI

on:
  pull_request:

# A second push to the same PR cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Ruff parses the source, it does not import it, so this job skips the
      # runtime dependencies entirely and finishes in a few seconds.
      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check --output-format=github .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # No .env is checked in, so every setting falls back to the default in
      # app/core/config.py. The tests never open a connection, so the default
      # DATABASE_URL pointing at a Postgres that is not running is fine.
      - name: Run tests
        run: pytest
